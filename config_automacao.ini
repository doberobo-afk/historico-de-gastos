# CONFIGURAÇÃO DE AUTOMAÇÃO DE GASTOS

# Intervalo de execução automática (em segundos)
# Valores comuns:
#   300  = 5 minutos
#   900  = 15 minutos
#   1800 = 30 minutos
#   3600 = 1 hora (padrão)
INTERVALO_EXECUCAO=3600

# Caminho para o arquivo CSV
ARQUIVO_EXTRATO=extrato_bancario.csv

# Caminho para a planilha Excel
ARQUIVO_EXCEL=Planilha_Controle_Financeiro.xlsm

# Aba da planilha onde os dados serão inseridos
ABA_EXCEL=CONTROLE FINANCEIRO

# Linha inicial para inserção de dados
LINHA_INICIAL=11

# Diretório para armazenar logs
DIRETORIO_LOGS=logs

# Habilitar visibilidade do Excel durante a automação
EXCEL_VISIVEL=True

# Máximo de tentativas de reconexão em caso de erro
TENTATIVAS_MAXIMAS=3

# Intervalo entre tentativas em caso de erro (segundos)
INTERVALO_TENTATIVA=30
